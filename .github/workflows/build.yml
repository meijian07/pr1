name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置
        run: cmake -S . -B build

      - name: 编译
        run: cmake --build build

      - name: 冒烟测试
        run: ./build/app
